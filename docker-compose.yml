# ---------------------------------------------------------------------------
# Infrastructure du projet : Event Store distribue (Axon Server),
# base de lecture (PostgreSQL) et son administration (pgAdmin).
# ---------------------------------------------------------------------------
services:

  axon-server:
    image: axoniq/axonserver:2024.1.4-jdk-17
    container_name: axon-server
    hostname: axon-server
    environment:
      AXONIQ_AXONSERVER_STANDALONE: "true"
      AXONIQ_AXONSERVER_DEVMODE_ENABLED: "true"
    ports:
      - "8024:8024"   # console d'administration HTTP
      - "8124:8124"   # bus de messages gRPC
    volumes:
      - axon-data:/axonserver/data
      - axon-events:/axonserver/events
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8024/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: accounts-postgres
    environment:
      POSTGRES_DB: accounts_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d accounts_db" ]
      interval: 10s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: accounts-pgadmin
    environment:
      # En mode desktop, pgAdmin travaille avec cet utilisateur interne :
      # c'est lui qui recoit la connexion pre-enregistree de servers.json.
      PGADMIN_DEFAULT_EMAIL: pgadmin4@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/accounts-servers.json
    ports:
      - "8888:80"
    volumes:
      # Connexion a la base de lecture deja enregistree au demarrage
      - ./docker/pgadmin/servers.json:/pgadmin4/accounts-servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  axon-data:
  axon-events:
  postgres-data:
