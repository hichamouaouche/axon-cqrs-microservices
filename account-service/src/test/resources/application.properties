# Configuration utilisee uniquement par les tests automatises.
# L'Event Store et la base de lecture sont en memoire (H2), Axon Server n'est pas sollicite.
spring.datasource.url=jdbc:h2:mem:accounts_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

axon.axonserver.enabled=false
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.serializer.general=jackson

# Les projections sont mises a jour dans la transaction de la commande :
# les assertions des tests d'integration restent deterministes.
axon.eventhandling.processors.account-projection.mode=subscribing

logging.level.hiou.hicham.accountservice=INFO
logging.level.org.axonframework=WARN
