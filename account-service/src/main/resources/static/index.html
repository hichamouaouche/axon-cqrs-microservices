<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Service - CQRS & Event Sourcing</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
        .card-header { background: #fff; font-weight: 600; border-bottom: 1px solid #e9ecef; }
        .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .82rem; }
        .navbar { background: #1c3d5a; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Account Service &mdash; CQRS &amp; Event Sourcing</span>
        <span class="text-white-50 small">Master SDIA 2 &middot; ENSET Mohammedia</span>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="row g-4">

        <!-- Cote commande -->
        <div class="col-lg-4">
            <div class="card mb-4">
                <div class="card-header">Creer un compte</div>
                <div class="card-body">
                    <div class="mb-2">
                        <label class="form-label small">Titulaire</label>
                        <input type="text" class="form-control form-control-sm" id="customerName" value="Hicham Ouaouche">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small">Devise</label>
                            <input type="text" class="form-control form-control-sm" id="currency" value="MAD">
                        </div>
                        <div class="col-6">
                            <label class="form-label small">Solde initial</label>
                            <input type="number" class="form-control form-control-sm" id="initialBalance" value="5400">
                        </div>
                    </div>
                    <button class="btn btn-primary btn-sm w-100" onclick="createAccount()">Envoyer la commande</button>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Operations</div>
                <div class="card-body">
                    <div class="mb-2">
                        <label class="form-label small">Identifiant du compte</label>
                        <input type="text" class="form-control form-control-sm mono" id="operationAccountId">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Montant</label>
                        <input type="number" class="form-control form-control-sm" id="amount" value="8700">
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-success btn-sm flex-fill" onclick="operation('credit')">Crediter</button>
                        <button class="btn btn-danger btn-sm flex-fill" onclick="operation('debit')">Debiter</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Statut du compte</div>
                <div class="card-body">
                    <select class="form-select form-select-sm mb-3" id="status">
                        <option value="ACTIVATED">ACTIVATED</option>
                        <option value="SUSPENDED">SUSPENDED</option>
                        <option value="CLOSED">CLOSED</option>
                    </select>
                    <button class="btn btn-warning btn-sm w-100" onclick="updateStatus()">Modifier le statut</button>
                </div>
            </div>
        </div>

        <!-- Cote lecture -->
        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Comptes projetes dans la base de lecture</span>
                    <button class="btn btn-outline-secondary btn-sm" onclick="loadAccounts()">Rafraichir</button>
                </div>
                <div class="card-body p-0">
                    <table class="table table-sm table-hover mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th class="ps-3">Identifiant</th>
                            <th>Titulaire</th>
                            <th>Solde</th>
                            <th>Statut</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="accountsBody"></tbody>
                    </table>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">Suivi temps reel du solde (Server-Sent Events)</div>
                <div class="card-body">
                    <canvas id="balanceChart" height="110"></canvas>
                </div>
            </div>

            <div class="card">
                <div class="card-header">Releve / Event Store</div>
                <div class="card-body">
                    <pre class="mono mb-0" id="output" style="max-height: 320px; overflow:auto;">Aucune donnee.</pre>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
    const COMMANDS = '/commands/accounts';
    const QUERIES = '/query/accounts';
    let eventSource = null;
    let chart = null;

    function show(data) {
        document.getElementById('output').textContent =
            typeof data === 'string' ? data : JSON.stringify(data, null, 2);
    }

    async function send(url, method, body) {
        const response = await fetch(url, {
            method: method,
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body)
        });
        const text = await response.text();
        if (!response.ok) {
            show('Commande refusee (' + response.status + ') : ' + text);
            return null;
        }
        return text;
    }

    async function createAccount() {
        const accountId = await send(COMMANDS + '/create', 'POST', {
            customerName: document.getElementById('customerName').value,
            currency: document.getElementById('currency').value,
            initialBalance: Number(document.getElementById('initialBalance').value)
        });
        if (accountId) {
            document.getElementById('operationAccountId').value = accountId;
            show('Compte cree, identifiant de l\'agregat : ' + accountId);
            loadAccounts();
        }
    }

    async function operation(type) {
        const accountId = document.getElementById('operationAccountId').value;
        const result = await send(COMMANDS + '/' + type, 'PUT', {
            accountId: accountId,
            currency: document.getElementById('currency').value,
            amount: Number(document.getElementById('amount').value)
        });
        if (result !== null) {
            show('Operation ' + type.toUpperCase() + ' acceptee sur le compte ' + accountId);
            loadAccounts();
        }
    }

    async function updateStatus() {
        const accountId = document.getElementById('operationAccountId').value;
        const result = await send(COMMANDS + '/status', 'PUT', {
            accountId: accountId,
            status: document.getElementById('status').value
        });
        if (result !== null) {
            show('Statut du compte ' + accountId + ' modifie');
            loadAccounts();
        }
    }

    async function loadAccounts() {
        const response = await fetch(QUERIES);
        const accounts = await response.json();
        const body = document.getElementById('accountsBody');
        body.innerHTML = '';
        accounts.forEach(account => {
            const badge = account.status === 'ACTIVATED' ? 'success'
                : (account.status === 'SUSPENDED' ? 'warning' : 'secondary');
            const row = document.createElement('tr');
            row.innerHTML =
                '<td class="ps-3 mono">' + account.id + '</td>' +
                '<td>' + account.customerName + '</td>' +
                '<td>' + account.balance.toFixed(2) + ' ' + account.currency + '</td>' +
                '<td><span class="badge text-bg-' + badge + '">' + account.status + '</span></td>' +
                '<td class="text-end pe-3">' +
                '<button class="btn btn-outline-primary btn-sm me-1" onclick="statement(\'' + account.id + '\')">Releve</button>' +
                '<button class="btn btn-outline-dark btn-sm me-1" onclick="events(\'' + account.id + '\')">Evenements</button>' +
                '<button class="btn btn-outline-info btn-sm" onclick="watch(\'' + account.id + '\')">Suivre</button>' +
                '</td>';
            body.appendChild(row);
        });
    }

    async function statement(accountId) {
        const response = await fetch(QUERIES + '/' + accountId + '/statement');
        show(await response.json());
    }

    async function events(accountId) {
        const response = await fetch(COMMANDS + '/eventStore/' + accountId);
        show(await response.json());
    }

    async function watch(accountId) {
        document.getElementById('operationAccountId').value = accountId;
        if (eventSource) {
            eventSource.close();
        }
        if (chart) {
            chart.destroy();
        }

        // Historique : le solde est reconstruit a partir du releve des operations,
        // exactement comme l'agregat reconstruit son etat depuis l'Event Store.
        const response = await fetch(QUERIES + '/' + accountId + '/statement');
        const statement = await response.json();
        const labels = ['ouverture'];
        const series = [statement.operations.reduce(
            (balance, operation) => operation.type === 'CREDIT'
                ? balance - operation.amount
                : balance + operation.amount,
            statement.account.balance)];
        statement.operations.forEach(operation => {
            labels.push(new Date(operation.operationDate).toLocaleTimeString());
            series.push(operation.type === 'CREDIT'
                ? series[series.length - 1] + operation.amount
                : series[series.length - 1] - operation.amount);
        });

        chart = new Chart(document.getElementById('balanceChart'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Solde du compte ' + accountId.substring(0, 8) + ' (' + statement.account.currency + ')',
                    data: series,
                    borderColor: '#1c3d5a',
                    backgroundColor: 'rgba(28,61,90,.12)',
                    tension: .25,
                    fill: true,
                    pointRadius: 3
                }]
            },
            options: {
                plugins: {legend: {display: true}},
                scales: {y: {beginAtZero: true}}
            }
        });

        // Temps reel : chaque nouvelle operation est poussee par le serveur (SSE).
        let firstMessage = true;
        eventSource = new EventSource(QUERIES + '/' + accountId + '/watch');
        eventSource.onmessage = message => {
            if (firstMessage) {
                // Le premier message est le resultat initial de la subscription query,
                // deja present dans l'historique reconstruit ci-dessus.
                firstMessage = false;
                return;
            }
            const watchEvent = JSON.parse(message.data);
            chart.data.labels.push(new Date(watchEvent.instant).toLocaleTimeString());
            chart.data.datasets[0].data.push(watchEvent.currentBalance);
            chart.update();
            loadAccounts();
        };
    }

    // Un identifiant passe dans l'URL (?watch=...) ouvre directement le suivi du compte.
    (async function start() {
        await loadAccounts();
        const requested = new URLSearchParams(window.location.search).get('watch');
        if (requested) {
            watch(requested);
        }
    })();
</script>
</body>
</html>
