# ---------------------------------------------------------------------------
# Micro-service account-service
# ---------------------------------------------------------------------------
server.port=8083
spring.application.name=account-service

# ---------------------------------------------------------------------------
# Event Store local en memoire (H2) pour demarrer
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:accounts_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Axon : serialisation du payload des evenements en JSON
# ---------------------------------------------------------------------------
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.serializer.general=jackson

# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
logging.level.hiou.hicham.accountservice=INFO
logging.level.org.axonframework=INFO
