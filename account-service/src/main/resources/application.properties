# ---------------------------------------------------------------------------
# Micro-service account-service
# ---------------------------------------------------------------------------
server.port=8083
spring.application.name=account-service

# ---------------------------------------------------------------------------
# Base de donnees de lecture (projection) : PostgreSQL
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:accounts_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Axon : serialisation du payload des evenements en JSON
# ---------------------------------------------------------------------------
axon.serializer.events=jackson
axon.serializer.messages=jackson
axon.serializer.general=jackson

# ---------------------------------------------------------------------------
# Documentation OpenAPI / Swagger UI
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------------------------------------------------------------------
# Journalisation
# ---------------------------------------------------------------------------
logging.level.hiou.hicham.accountservice=INFO
logging.level.org.axonframework=INFO
